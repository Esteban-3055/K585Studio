name: Build and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build K585Studio.sln -c Release
      - run: dotnet run --project tests/K585Studio.Checks -c Release --no-build
      - run: dotnet publish src/K585Studio.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/K585Studio-win-x64
      - name: Validate invisible UI
        shell: pwsh
        run: |
          $uiTest = Start-Process -FilePath artifacts/K585Studio-win-x64/K585Studio.exe -ArgumentList '--ui-self-test',"$env:RUNNER_TEMP/K585Studio-UI" -WindowStyle Hidden -PassThru -Wait
          if ($uiTest.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP/K585Studio-UI/ui-error.txt"; exit 1 }
          Get-Content "$env:RUNNER_TEMP/K585Studio-UI/ui-checks.json"
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/K585Studio-win-x64/* -DestinationPath artifacts/K585Studio-v0.1.0-win-x64.zip
          $assetHash = (Get-FileHash artifacts/K585Studio-v0.1.0-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$assetHash  K585Studio-v0.1.0-win-x64.zip" | Set-Content artifacts/K585Studio-v0.1.0-win-x64.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: K585Studio-v0.1.0-win-x64
          path: |
            artifacts/K585Studio-v0.1.0-win-x64.zip
            artifacts/K585Studio-v0.1.0-win-x64.zip.sha256
      - name: Publish initial v0.1 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'v0.1.0 already exists; existing release kept.'; exit 0 }
          gh release create v0.1.0 artifacts/K585Studio-v0.1.0-win-x64.zip artifacts/K585Studio-v0.1.0-win-x64.zip.sha256 --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'K585 Studio v0.1' --notes-file docs/RELEASE-v0.1.0.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
