name: Build, validate and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          "value=$($props.Project.PropertyGroup.Version)" >> $env:GITHUB_OUTPUT
      - run: dotnet build K585Studio.sln -c Release
      - run: dotnet run --project tests/K585Studio.Checks -c Release --no-build
      - run: dotnet publish src/K585Studio.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/K585Studio-win-x64
      - name: Invisible UI checks
        shell: pwsh
        run: |
          $ui = Start-Process -FilePath artifacts/K585Studio-win-x64/K585Studio.exe -ArgumentList '--ui-self-test',"$env:RUNNER_TEMP/K585Studio-UI" -WindowStyle Hidden -PassThru -Wait
          if ($ui.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP/K585Studio-UI/ui-error.txt"; exit 1 }
          Get-Content "$env:RUNNER_TEMP/K585Studio-UI/ui-checks.json"
      - name: Prepare installer compiler on build runner
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
            $signature = Get-AuthenticodeSignature -LiteralPath $setup
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Pyrsys*') { throw 'Inno signature invalid' }
            $tools = Join-Path $env:RUNNER_TEMP 'InnoSetup'
            $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/NOICONS',('/DIR="'+$tools+'"') -WindowStyle Hidden -PassThru -Wait
            if ($process.ExitCode -ne 0) { throw 'Inno setup failed' }
            $tools >> $env:GITHUB_PATH
          }
      - name: Build setup executable
        shell: pwsh
        run: ./scripts/build-installer.ps1 -PublishDirectory artifacts/K585Studio-win-x64 -OutputDirectory artifacts
      - name: Install, upgrade and uninstall test
        shell: pwsh
        run: ./scripts/test-installed.ps1 -Installer 'artifacts/K585Studio-${{ steps.version.outputs.value }}-Setup-win-x64.exe' -TestDirectory "$env:RUNNER_TEMP/K585Studio-installed"
      - name: Upgrade published v0.2.0 and preserve private data
        shell: pwsh
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'K585Studio-0.2.0-Setup-win-x64.exe'
          Invoke-WebRequest 'https://github.com/Esteban-3055/K585Studio/releases/download/v0.2.0/K585Studio-0.2.0-Setup-win-x64.exe' -OutFile $previous
          $expected = '03fb6afccfb8fa5d5b87e102cd20cac6adfb17df322fd8209c9337fa016c231c'
          if ((Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Published previous installer changed' }
          ./scripts/test-installed.ps1 -Installer 'artifacts/K585Studio-${{ steps.version.outputs.value }}-Setup-win-x64.exe' -PreviousInstaller $previous -TestDirectory "$env:RUNNER_TEMP/K585Studio-upgraded-from-v020"
      - name: Package portable
        shell: pwsh
        run: |
          $name = 'K585Studio-v${{ steps.version.outputs.value }}-win-x64.zip'
          Compress-Archive -Path artifacts/K585Studio-win-x64/* -DestinationPath "artifacts/$name"
          $hash = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "artifacts/$name.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: K585Studio-release
          path: |
            artifacts/*-Setup-win-x64.exe
            artifacts/*-Setup-win-x64.exe.sha256
            artifacts/*.zip
            artifacts/*.zip.sha256
  release:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: K585Studio-release
          path: artifacts
      - name: Publish verified version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ needs.windows.outputs.version }}'
          gh release view "v$version" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Existing release kept.'; exit 0 }
          $assets = @(Get-ChildItem artifacts -File | ForEach-Object { $_.FullName })
          gh release create "v$version" @assets --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "K585 Studio v$version" --notes-file "docs/RELEASE-v$version.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
